<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<meta name="generator" content="video-to-html">
<title>{{title}}</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("v2h-theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #f0f2f8;
    --text: #1b2030;
    --muted: #5a6276;
    --border: #e2e5ee;
    --accent: #4f46e5;
    --accent-2: #0ea5e9;
    --accent-soft: #eceefe;
    --accent-text: #3730a3;
    --tip: #0f9d58; --tip-soft: #e8f6ee;
    --note: #2563eb; --note-soft: #e9f0fe;
    --warn: #b45309; --warn-soft: #fdf3e4;
    --code-bg: #0f172a; --code-text: #e2e8f0;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1017; --surface: #151924; --surface-2: #1b2030; --text: #e6e8ef; --muted: #9ba3b8;
      --border: #272d3d; --accent: #8b8cf8; --accent-2: #38bdf8; --accent-soft: #22254a; --accent-text: #c7c8ff;
      --tip: #34d399; --tip-soft: #10291f; --note: #60a5fa; --note-soft: #13213b; --warn: #fbbf24; --warn-soft: #2d2210;
      --code-bg: #0a0d14; --code-text: #e2e8f0; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1017; --surface: #151924; --surface-2: #1b2030; --text: #e6e8ef; --muted: #9ba3b8;
    --border: #272d3d; --accent: #8b8cf8; --accent-2: #38bdf8; --accent-soft: #22254a; --accent-text: #c7c8ff;
    --tip: #34d399; --tip-soft: #10291f; --note: #60a5fa; --note-soft: #13213b; --warn: #fbbf24; --warn-soft: #2d2210;
    --code-bg: #0a0d14; --code-text: #e2e8f0; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 17px; line-height: 1.7; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  img { max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 100; }
  .skip:focus { left: 16px; }

  /* Top bar */
  .progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 60; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform-origin: 0 50%; transform: scaleX(0); }
  .topbar {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; min-height: 60px; background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(160%) blur(10px); -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .crumb { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; font: inherit; font-size: 14px;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }
  .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: block; }
  :root[data-theme="dark"] .theme-btn .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
    :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
  }
  .toc-btn { display: none; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  .toc { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; padding: 24px 4px 24px 0; }
  .toc-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 10px 10px; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc ol ol { padding-left: 14px; margin: 2px 0 6px; border-left: 1px solid var(--border); margin-left: 12px; }
  .toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14.5px; line-height: 1.4; }
  .toc ol ol a { font-size: 13.5px; padding: 4px 10px; }
  .toc a:hover { color: var(--text); background: var(--surface-2); }
  .toc a.active { color: var(--accent-text); background: var(--accent-soft); font-weight: 600; }
  main { min-width: 0; padding: 32px 0 64px; }

  /* Hero */
  .hero { max-width: 76ch; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); padding: 36px clamp(20px, 4vw, 44px); box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .hero h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.15; letter-spacing: -.02em; margin: 14px 0 8px; }
  .hero .subtitle { color: var(--muted); font-size: 18px; margin: 0 0 18px; max-width: 70ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 13.5px; color: var(--muted); background: var(--surface-2); }
  .chips a { color: inherit; }
  .tldr { margin-top: 26px; padding: 20px 22px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .tldr h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-text); }
  .tldr ul { margin: 0; padding-left: 20px; }
  .tldr li { margin: 4px 0; }

  /* Content */
  .content { max-width: 76ch; margin: 0 auto; }
  .chapter { margin-top: 56px; }
  .chapter > h2 { font-size: clamp(23px, 2.8vw, 30px); line-height: 1.25; letter-spacing: -.01em; margin: 0 0 6px; }
  .chapter h3 { font-size: 20px; margin: 34px 0 6px; line-height: 1.3; }
  .chapter-meta { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .content p { margin: 0 0 16px; }
  .content ul, .content ol { padding-left: 24px; margin: 0 0 18px; }
  .content li { margin: 6px 0; }
  .content strong { font-weight: 650; }
  .lead { font-size: 19px; color: var(--muted); }
  .ts {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; text-decoration: none; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); vertical-align: 1px;
  }
  a.ts:hover { color: var(--accent-text); border-color: var(--accent); }
  a.ts::before { content: "▶"; font-size: 9px; }

  figure.shot { margin: 26px 0; }
  figure.shot img {
    display: block; width: 100%; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow);
    cursor: zoom-in; background: var(--surface-2);
  }
  figure.shot figcaption { margin-top: 10px; font-size: 14.5px; color: var(--muted); line-height: 1.55; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 24px 0; }
  .shots figure.shot { margin: 0; }

  ol.steps { list-style: none; counter-reset: step; padding-left: 0; }
  ol.steps > li { counter-increment: step; position: relative; padding: 2px 0 6px 52px; margin: 0 0 18px; }
  ol.steps > li::before {
    content: counter(step); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  ol.steps > li > strong:first-child { display: block; font-size: 17.5px; margin-bottom: 4px; }

  .callout { border-radius: 12px; padding: 14px 18px; margin: 22px 0; border: 1px solid var(--border); border-left-width: 4px; background: var(--surface); }
  .callout > :last-child { margin-bottom: 0; }
  .callout-title { font-weight: 700; margin: 0 0 4px !important; font-size: 15px; }
  .callout.tip { border-left-color: var(--tip); background: var(--tip-soft); } .callout.tip .callout-title { color: var(--tip); }
  .callout.note { border-left-color: var(--note); background: var(--note-soft); } .callout.note .callout-title { color: var(--note); }
  .callout.warn { border-left-color: var(--warn); background: var(--warn-soft); } .callout.warn .callout-title { color: var(--warn); }

  ul.keypoints { list-style: none; padding: 0; display: grid; gap: 10px; }
  ul.keypoints li { margin: 0; padding: 12px 16px 12px 44px; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  ul.keypoints li::before { content: "✓"; position: absolute; left: 16px; top: 12px; font-weight: 800; color: var(--tip); }

  blockquote.quote { margin: 24px 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--accent); color: var(--text); font-size: 18px; font-style: italic; }
  blockquote.quote footer { font-style: normal; font-size: 14px; color: var(--muted); margin-top: 6px; }

  dl.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; }
  dl.glossary dt { font-weight: 700; } dl.glossary dd { margin: 0; color: var(--muted); }
  @media (max-width: 640px) { dl.glossary { grid-template-columns: 1fr; } dl.glossary dd { margin-bottom: 8px; } }

  .table-wrap { overflow-x: auto; margin: 22px 0; border: 1px solid var(--border); border-radius: 12px; }
  .content table { border-collapse: collapse; width: 100%; font-size: 15px; }
  .content th, .content td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .content th { background: var(--surface-2); font-weight: 700; }
  .content tr:last-child td { border-bottom: 0; }
  /* On phones a wide table scrolls inside .table-wrap; without a floor, text columns shrink to one word per line. */
  @media (max-width: 640px) { .content th, .content td { min-width: 8em; } }

  code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }
  pre { background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 20px 0; font-size: 14px; line-height: 1.6; color-scheme: dark; }
  pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
  /* The copy button sits on a wrapper, so it stays put when the code scrolls sideways. */
  .code-wrap { position: relative; margin: 20px 0; }
  .code-wrap > pre { margin: 0; }
  .copy-btn { position: absolute; top: 8px; right: 8px; font: 600 12px var(--font); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: var(--code-bg); color: #e2e8f0; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .code-wrap:hover .copy-btn, .copy-btn:focus-visible, .copy-btn.done { opacity: 1; }
  @media (hover: none) { .copy-btn { opacity: 1; } }
  kbd { font-family: var(--mono); font-size: .85em; padding: 1px 7px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); }

  .page-footer { max-width: 76ch; margin: 72px auto 0; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }

  /* Lightbox */
  dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
  dialog.lightbox::backdrop { background: rgba(5, 8, 15, .86); }
  dialog.lightbox img { display: block; max-width: 96vw; max-height: 84vh; border-radius: 10px; margin: 0 auto; }
  dialog.lightbox p { color: #e5e7eb; text-align: center; margin: 10px 8px 0; font-size: 14px; }
  dialog.lightbox .close { position: fixed; top: 14px; right: 14px; }

  .to-top { position: fixed; right: 18px; bottom: 18px; opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: var(--shadow); }
  .to-top.show { opacity: 1; pointer-events: auto; }
  .scrim { display: none; }

  /* Responsive */
  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px; gap: 0; }
    .toc-btn { display: inline-flex; }
    .toc {
      /* align-self: stretch undoes the desktop "start", which would shrink the fixed drawer to its content height. */
      position: fixed; top: 0; left: 0; bottom: 0; align-self: stretch; width: min(86vw, 340px); max-height: none; z-index: 70;
      background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow);
    }
    body.toc-open .toc { transform: none; }
    body.toc-open .scrim { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(5, 8, 15, .45); }
    main { padding-top: 20px; }
    .hero { padding: 26px 18px; }
    body { font-size: 16.5px; }
  }

  @media print {
    .topbar, .toc, .progress, .to-top, .copy-btn, .scrim { display: none !important; }
    .layout { display: block; max-width: none; padding: 0; }
    body { background: #fff; color: #000; font-size: 12pt; }
    .hero, figure.shot img { box-shadow: none; }
    .chapter { break-inside: auto; } figure.shot { break-inside: avoid; }
    a.ts::after { content: ""; }
  }
</style>
</head>
<body data-copy="{{label_copy}}" data-copied="{{label_copied}}">
<a class="skip" href="#main">{{label_skip}}</a>
<div class="progress" aria-hidden="true"></div>
<div class="topbar">
  <button class="icon-btn toc-btn" type="button" aria-controls="toc" aria-expanded="false" aria-label="{{label_toc}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div class="crumb">{{title}}</div>
  <button class="icon-btn theme-btn" type="button" aria-label="{{label_theme}}" title="{{label_theme}}">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<div class="scrim" aria-hidden="true"></div>
<div class="layout">
  <aside class="toc" id="toc">
    <nav aria-label="{{label_toc}}">
      <p class="toc-title">{{label_toc}}</p>
      {{toc}}
    </nav>
  </aside>
  <main id="main">
    {{header}}
    <article class="content">
      {{content}}
    </article>
    <footer class="page-footer">{{footer}}</footer>
  </main>
</div>
<dialog class="lightbox" aria-label="{{label_image}}">
  <button class="icon-btn close" type="button" aria-label="{{label_close}}">✕</button>
  <img alt="">
  <p></p>
</dialog>
<button class="icon-btn to-top" type="button" aria-label="{{label_top}}">↑</button>
<script>
(function () {
  var root = document.documentElement;
  function current() {
    var t = root.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.querySelector(".theme-btn").addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("v2h-theme", next); } catch (e) {}
  });

  var body = document.body, tocBtn = document.querySelector(".toc-btn");
  function setToc(open) { body.classList.toggle("toc-open", open); tocBtn.setAttribute("aria-expanded", String(open)); }
  tocBtn.addEventListener("click", function () { setToc(!body.classList.contains("toc-open")); });
  document.querySelector(".scrim").addEventListener("click", function () { setToc(false); });
  document.querySelectorAll(".toc a").forEach(function (a) { a.addEventListener("click", function () { setToc(false); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setToc(false); });

  var bar = document.querySelector(".progress"), top = document.querySelector(".to-top");
  function onScroll() {
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (h > 0 ? Math.min(1, scrollY / h) : 0) + ")";
    top.classList.toggle("show", scrollY > 700);
  }
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  top.addEventListener("click", function () { scrollTo({ top: 0 }); });

  // Scrollspy: the active entry is the last heading target that has scrolled above
  // the line below the top bar. Recomputed on scroll, so it is never stale (also at the top).
  var spy = [], active = null;
  document.querySelectorAll(".toc a[href^='#']").forEach(function (a) {
    var el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
    if (el) spy.push({ el: el, a: a });
  });
  function updateSpy() {
    var hit = null;
    for (var i = 0; i < spy.length; i++) { if (spy[i].el.getBoundingClientRect().top <= 120) hit = spy[i]; else break; }
    // At the very bottom a short last section can never reach the line: pick it anyway.
    if (spy.length && scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 2) hit = spy[spy.length - 1];
    if (hit !== active) {
      if (active) active.a.classList.remove("active");
      if (hit) hit.a.classList.add("active");
      active = hit;
    }
  }
  addEventListener("scroll", updateSpy, { passive: true });
  addEventListener("resize", updateSpy); updateSpy();

  var dlg = document.querySelector("dialog.lightbox");
  if (dlg && dlg.showModal) {
    var big = dlg.querySelector("img"), cap = dlg.querySelector("p");
    document.querySelectorAll("figure.shot img").forEach(function (img) {
      img.addEventListener("click", function () {
        big.src = img.src; big.alt = img.alt;
        var fc = img.closest("figure").querySelector("figcaption");
        cap.textContent = fc ? fc.textContent : img.alt;
        dlg.showModal();
      });
    });
    dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.classList.contains("close")) dlg.close(); });
  }

  document.querySelectorAll("pre").forEach(function (pre) {
    if (!navigator.clipboard) return;
    var src = pre.querySelector("code") || pre, text = src.innerText;
    var b = document.createElement("button");
    // Labels come from body data-* attributes: entities in a <script> would not be decoded.
    b.className = "copy-btn"; b.type = "button"; b.textContent = body.dataset.copy;
    b.addEventListener("click", function () {
      navigator.clipboard.writeText(text.trim()).then(function () {
        b.textContent = body.dataset.copied; b.classList.add("done");
        setTimeout(function () { b.textContent = body.dataset.copy; b.classList.remove("done"); }, 1500);
      });
    });
    var wrap = document.createElement("div");
    wrap.className = "code-wrap";
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre); wrap.appendChild(b);
  });
})();
</script>
</body>
</html>
